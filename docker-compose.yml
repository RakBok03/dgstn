version: '3.8'

services:
  db:
    image: postgres:15
    volumes:
      - postgres_data:/var/lib/postgresql/data
    env_file:
      - .env
    networks:
      - dgstn_net

  web:
    build: .
    # Используем gunicorn для работы на сервере. 
    # Убедись, что gunicorn прописан в requirements.txt
    command: gunicorn core.wsgi:application --bind 0.0.0.0:8000
    volumes:
      - .:/code
      - ./media:/code/media
      - ./static_result:/code/static_result
    ports:
      - "8001:8000"
    env_file:
      - .env
    depends_on:
      - db
    networks:
      - dgstn_net
      - npm_network

networks:
  dgstn_net:
    driver: bridge
  npm_network:
    external: true

volumes:
  postgres_data: