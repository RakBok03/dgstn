{% extends 'base.html' %}

{% block content %}
<section class="max-w-3xl mx-auto px-4 py-16">
    <div class="bg-white rounded-3xl border border-slate-100 shadow-sm p-8 md:p-10 text-center">
        <h1 class="text-3xl md:text-4xl font-black text-slate-900 mb-3">Профиль</h1>
        <p class="text-slate-600 max-w-xl mx-auto">
            Войдите или зарегистрируйтесь, чтобы сохранять избранные туры, оставлять отзывы и комментарии,
            а также видеть отправленные заявки.
        </p>

        <div class="mt-8 grid grid-cols-1 sm:grid-cols-2 gap-3">
            <a href="{% url 'login' %}?next={% url 'profile' %}" class="w-full text-center bg-slate-900 text-white py-3 rounded-xl font-bold hover:bg-emerald-600 transition">
                Войти
            </a>
            <a href="{% url 'register' %}" class="w-full text-center bg-white border border-slate-200 text-slate-700 py-3 rounded-xl font-bold hover:border-emerald-500 hover:text-emerald-700 transition">
                Регистрация
            </a>
        </div>
    </div>
</section>
{% endblock %}
